name: Weekly IG draft generation

# 01:00 UTC Monday = 08:00 WIB (UTC+7) Monday.
on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Generate drafts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Set this as a repository variable (Settings > Secrets and variables
          # > Variables). The model is deliberately not hardcoded in the source.
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python -m src.run

      - name: Evaluate the run
        if: always()
        run: python eval/run_eval.py || true

      - name: Commit drafts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add drafts/ run_log.json eval/results.md
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Weekly drafts for $(date -u +%G-W%V)"
            git push
          fi
