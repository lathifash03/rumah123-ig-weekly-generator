# Relevance and caption rules. Everything here is enforced by pure code in
# src/filter.py and src/validate.py - no LLM is asked to judge these.

relevance:
  # Minimum number of distinct keyword matches for an item to be kept.
  min_matches: 1

  # Matched case-insensitively with WORD BOUNDARIES, not naive substring.
  # Reason: a bare substring match for "mbr" matched unrelated finance
  # headlines during feed verification, and "properti" must not fire on a
  # longer unrelated token. Boundary matching is what src/filter.py does.
  keywords:
    - kpr
    - kredit pemilikan rumah
    - suku bunga
    - bunga kpr
    - bi rate
    - rumah subsidi
    - subsidi rumah
    - rumah murah
    - flpp
    - tapera
    - harga rumah
    - properti
    - cicilan
    - angsuran
    - hunian
    - perumahan
    - rumah pertama
    - dp rumah
    - uang muka
    - apartemen
    - rusun
    - mbr
    - masyarakat berpenghasilan rendah
    - backlog rumah
    - btn
    - real estate
    - sewa rumah
    - developer properti
    - ltv

  # Items whose title matches any of these are dropped even if a keyword hit.
  # These are recurring non-actionable formats seen in the live feeds.
  title_blocklist:
    - "^video:"
    - "^foto:"
    - "^infografis:"
    - "^live:"
    - "prediksi skor"
    - "^potret"

dedupe:
  # Two headlines are treated as the same story when EITHER signal fires.
  #
  # Both thresholds were measured, not guessed. Across the 43 candidates
  # fetched on 2026-11-07, headlines that genuinely retold one story reached a
  # character-sequence ratio of at most 0.64 and a content-word overlap of at
  # most 0.50. An earlier single threshold of 0.82 therefore deduplicated
  # nothing at all, and nine separate headlines about one subsidised apartment
  # project in Manggarai all reached the ranker.
  #
  # These are tuned on one week of real headlines and are the most likely part
  # of the filter to need revisiting on other weeks.
  title_sequence_threshold: 0.62
  title_token_overlap_threshold: 0.42

  # Second signal: two headlines are the same story when they share at least
  # this many SPECIFIC words with a high combined rarity score. Rarity is
  # log(N / document frequency) across the week's candidates, and the
  # relevance keywords are excluded because every candidate shares those.
  #
  # The score is sum(log(N / document frequency)) over shared specific words,
  # divided by log(N) so it does not grow with the size of the week's batch.
  #
  # Calibrated on the 43 candidates of 2026-11-07. Retellings of one story
  # scored 1.59 and above. The nearest non-duplicates scored 1.52 and below:
  # an Australian house-price story against an Indonesian one, a UK
  # interest-rate story against an Indonesian one, and two different Jakarta
  # development stories. 1.55 sits in that gap.
  #
  # Known limits, both accepted deliberately:
  # - A cluster whose members share only ONE specific word is not caught. The
  #   four IKN headlines share "ikn" and nothing else specific, so they still
  #   reach the ranker. One coincidental rare word is too weak to act on.
  # - These numbers come from one week of headlines. This is the part of the
  #   filter most likely to need revisiting.
  story_rarity_score_threshold: 1.55
  min_shared_specific_words: 2

caption:
  max_words_excluding_hashtags: 90
  hashtag_count: 2
  required_hashtag: "#Rumah123"
  max_emoji: 1

  # Digits inside these tokens are part of a name, not a factual claim, so they
  # are removed before number grounding. Without this, the "123" in the brand
  # name Rumah123 is reported as an ungrounded number.
  brand_tokens:
    - "Rumah123"

  forbidden_characters:
    em_dash: "—"
    en_dash_as_separator: "–"
    semicolon: ";"

  # Hard-selling / hype language that breaks the brand voice.
  banned_phrases:
    - "buruan"
    - "jangan sampai ketinggalan"
    - "jangan sampai menyesal"
    - "kesempatan terakhir"
    - "promo terbatas"
    - "stok terbatas"
    - "harga termurah"
    - "termurah"
    - "dijamin"
    - "pasti untung"
    - "untung besar"
    - "cuan"
    - "segera miliki"
    - "miliki sekarang"
    - "hubungi kami"
    - "klik link di bio"
    - "daftar sekarang"
    - "investasi terbaik"
    - "pilihan terbaik"
    - "wajib punya"
    - "gratis"
    - "diskon besar"
    - "bunga 0%"
    - "tanpa risiko"
    - "sudah pasti"
